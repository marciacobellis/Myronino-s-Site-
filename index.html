<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dom1nck_ · Streamer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<style>
:root{
  --bg:#12091f; --card:rgba(30,18,50,.72); --line:rgba(255,255,255,.1);
  --text:#f4ecff; --muted:#bda9dd; --accent:#8b5cf6;
  --twitch:#9146ff; --discord:#5865f2; --tiktok:#fe2c55;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);
  display:grid;place-items:center;padding:20px;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,#2a1450,#0d0718)}
.bg div{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;transform:scale(1.05)}
.bg div.on{opacity:1;animation:zoom 12s ease-out forwards}
@keyframes zoom{to{transform:scale(1.14)}}
.bg::after{content:"";position:absolute;inset:0;background:rgba(10,4,20,.45)}
.card{width:100%;max-width:420px;padding:30px 22px 24px;border-radius:28px;background:var(--card);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);text-align:center}
.avatar{position:relative;width:132px;height:132px;margin:0 auto 18px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid var(--accent);background:#2a1450}
.dot{position:absolute;right:6px;bottom:6px;width:20px;height:20px;border-radius:50%;background:#22c55e;border:3px solid #1b0f2e}
h1{font-size:2.1rem;letter-spacing:-.5px}
.role{color:#d8b8ff;margin:6px 0 22px;font-size:1.05rem}
.link{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:12px;border-radius:20px;border:1px solid var(--line);
  background:rgba(255,255,255,.06);color:inherit;text-decoration:none;text-align:left;transition:transform .15s,background .15s}
.link:hover,.link:focus-visible{transform:translateY(-2px);background:rgba(255,255,255,.1)}
.ico{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:color-mix(in srgb,var(--c) 25%,transparent)}
.link b{display:block;font-size:1.2rem;color:var(--c)}
.link span{color:var(--muted)}
.row{display:flex;gap:10px;margin-top:6px}
.row button{flex:1;padding:12px;border-radius:999px;border:1px solid #4b46b8;background:rgba(40,30,110,.35);
  color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.row button:hover{background:rgba(70,60,170,.5)}
.fab{position:fixed;width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:rgba(15,10,30,.85);
  color:#fff;font-size:1.3rem;cursor:pointer;display:grid;place-items:center}
#mute{top:18px;right:18px}
#info{bottom:18px;left:18px;color:var(--accent)}
.modal{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:rgba(5,2,12,.7);z-index:5}
.modal.open{display:grid}
.box{width:100%;max-width:400px;max-height:80vh;overflow:auto;padding:24px;border-radius:24px;background:#1d1133;border:1px solid var(--line)}
.box h2{margin-bottom:14px}
.box li{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.box li span:first-child{color:var(--muted)}
.box p{color:var(--muted);line-height:1.5}
.box button{margin-top:16px;width:100%;padding:12px;border-radius:12px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bg div.on{animation:none}.link{transition:none}}
</style>
</head>
<body>

<div class="bg" id="bg"></div>

<button class="fab" id="mute" aria-label="Attiva o disattiva la musica">🔊</button>

<main class="card">
  <div class="avatar">
    <img id="avatar" src="img/avatar.png" alt="Avatar">
    <span class="dot" title="Online"></span>
  </div>
  <h1 id="name"></h1>
  <p class="role" id="role"></p>
  <div id="links"></div>
  <div class="row">
    <button data-m="pc">🖥️ Che PC ho?</button>
    <button data-m="per">⌨️ Periferiche</button>
  </div>
</main>

<button class="fab" id="info" aria-label="Informazioni">ℹ️</button>

<div class="modal" id="modal"><div class="box" id="box"></div></div>

<audio id="audio" loop preload="auto"></audio>

<script>
/* ====== MODIFICA SOLO QUI ====== */
const CONFIG = {
  name: "𝕄𝕪𝕣𝕠𝕟𝕚𝕟𝕠",
  role: "Streamer (TikTok/Youtube)",
  backgrounds: ["img/bg1.jpg","img/bg2.jpg","img/bg3.jpg","img/bg4.jpg"],
  slideSeconds: 6,
  music: "audio/musica.mp3",
  volume: 0.35,
  links: [
    {label:"𝕄𝕪𝕣𝕠𝕟𝕚𝕟𝕠", sub:"su Youtube",  url:"https://youtube.com/@myronino/",      color:"#9146ff", icon:"📺"},
    {label:"𝕄𝕪𝕣𝕠𝕟𝕚𝕟𝕠'𝕤 ℂ𝕠𝕞𝕞𝕦𝕟𝕚𝕥𝕪", sub:"su Discord", url:"https://discord.gg/", color:"#5865f2", icon:"💬"},
    {label:"𝕄𝕪𝕣𝕠𝕟𝕚𝕟𝕠", sub:"su TikTok",  url:"https://tiktok.com/@myronino",    color:"#fe2c55", icon:"🎵"}
  ],
  pc: [["CPU","Inserisci qui"],["Scheda video","Inserisci qui"],["RAM","Inserisci qui"],["Archiviazione","Inserisci qui"],["Scheda madre","Inserisci qui"]],
  periferiche: [["Mouse","Inserisci qui"],["Tastiera","Inserisci qui"],["Cuffie","Inserisci qui"],["Microfono","Inserisci qui"],["Monitor","Inserisci qui"]],
  info: "Sito ufficiale di Dom1nck_. Seguilo sui social per non perdere le dirette!"
};
/* ================================= */

const $ = id => document.getElementById(id);
$("name").textContent = CONFIG.name;
$("role").textContent = CONFIG.role;
document.title = CONFIG.name + " · Streamer";

// Link social
$("links").innerHTML = CONFIG.links.map(l =>
  `<a class="link" href="${l.url}" target="_blank" rel="noopener" style="--c:${l.color}">
     <div class="ico">${l.icon}</div><div><b>${l.label}</b><span>${l.sub}</span></div></a>`).join("");

// Sfondi che scorrono (dissolvenza)
const bg = $("bg");
const slides = CONFIG.backgrounds.map(src => {
  const d = document.createElement("div");
  d.style.backgroundImage = `url("${src}")`;
  bg.appendChild(d); return d;
});
let i = 0;
if (slides.length) {
  slides[0].classList.add("on");
  if (slides.length > 1) setInterval(() => {
    slides[i].classList.remove("on");
    i = (i + 1) % slides.length;
    slides[i].classList.add("on");
  }, CONFIG.slideSeconds * 1000);
}

// Musica: i browser bloccano l'autoplay, parte al primo tocco
const audio = $("audio"), mute = $("mute");
audio.src = CONFIG.music; audio.volume = CONFIG.volume;
let on = true;
const start = () => { if (on) audio.play().catch(()=>{}); };
audio.play().catch(()=>{});
["pointerdown","keydown"].forEach(e => addEventListener(e, start, {once:true}));
mute.onclick = ev => {
  ev.stopPropagation();
  on = !on;
  if (on) audio.play().catch(()=>{}); else audio.pause();
  mute.textContent = on ? "🔊" : "🔇";
};

// Finestre
const modal = $("modal"), box = $("box");
const show = (title, html) => {
  box.innerHTML = `<h2>${title}</h2>${html}<button id="close">Chiudi</button>`;
  modal.classList.add("open"); $("close").onclick = () => modal.classList.remove("open");
};
const list = a => "<ul>" + a.map(r => `<li><span>${r[0]}</span><span>${r[1]}</span></li>`).join("") + "</ul>";
document.querySelector('[data-m="pc"]').onclick  = () => show("Che PC ho?", list(CONFIG.pc));
document.querySelector('[data-m="per"]').onclick = () => show("Periferiche", list(CONFIG.periferiche));
$("info").onclick = () => show("Info", `<p>${CONFIG.info}</p>`);
modal.onclick = e => { if (e.target === modal) modal.classList.remove("open"); };
addEventListener("keydown", e => { if (e.key === "Escape") modal.classList.remove("open"); });
</script>
</body>
</html>
